<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
       xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html" lang="pt-br">
  <h:head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title> Sistema ERP Escolar</title>
    <meta
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
      name="viewport"
    />
    <link
      rel="icon"
      href="#{request.contextPath}/resources/assets/img/kaiadmin/favicon.ico"
      type="image/x-icon"
    />

    <!-- Fonts and icons -->
    
    <h:outputScript library="assets" name="js/plugin/webfont/webfont.min.js" />
    <script>
      WebFont.load({
        google: { families: ["Public Sans:300,400,500,600,700"] },
        custom: {
          families: [
            "Font Awesome 5 Solid",
            "Font Awesome 5 Regular",
            "Font Awesome 5 Brands",
            "simple-line-icons",
          ],
          urls: [ "#{request.contextPath}/resources/assets/css/fonts.min.css" />],
        },
        active: function () {
          sessionStorage.fonts = true;
        },
      });
    </script>

    <!-- CSS Files -->
    
    <!-- CSS do Kaiadmin via JSF -->
    <!-- CSS com caminho absoluto usando contextPath -->
    <link rel="stylesheet" href="#{request.contextPath}/resources/assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="#{request.contextPath}/resources/assets/css/plugins.min.css" />
    <link rel="stylesheet" href="#{request.contextPath}/resources/assets/css/kaiadmin.min.css" />
    <link rel="stylesheet" href="#{request.contextPath}/resources/assets/css/demo.css" />

    
  </h:head>
  <h:body>
    <div class="wrapper">
      <!-- sidebar aqui -->
      <ui:include src="/WEB-INF/template/sidebar.xhtml" />

      <div class="main-panel">
     	<!-- topbar aqui -->
     	<ui:include src="/WEB-INF/template/topbar.xhtml" />
        <div class="container">
          <div class="page-inner">
          	<ui:insert name="conteudo"/>
          </div>
        </div>

        <!-- footer fica aqui -->
        <ui:include src="/WEB-INF/template/footer.xhtml" />
      </div>

      
      <!-- End Custom template -->
    </div>
    <!--   Core JS Files   -->
    
    <h:outputScript library="assets" name="js/core/popper.min.js" />
    <h:outputScript library="assets" name="js/core/bootstrap.min.js" />
    

    <!-- jQuery Scrollbar -->
    <h:outputScript library="assets" name="js/plugin/jquery-scrollbar/jquery.scrollbar.min.js" />
    
    <!-- jQuery Sparkline -->
    <h:outputScript library="assets" name="/js/plugin/jquery.sparkline/jquery.sparkline.min.js" />
   

    <!-- Datatables -->
    <h:outputScript library="assets" name="/js/plugin/datatables/datatables.min.js" />
    

    <!-- Kaiadmin JS -->
    <h:outputScript library="assets" name="/js/kaiadmin.min.js" />
    
    <!-- - outro aqui -->
    <h:outputScript library="assets" name="/js/core/popper.min.js" />
    <h:outputScript library="assets" name="/js/core/bootstrap.min.js" />
    

    <!-- jQuery Scrollbar -->
    
    <h:outputScript library="assets" name="/js/plugin/jquery-scrollbar/jquery.scrollbar.min.js" />
    <!-- jQuery Sparkline -->
    
    <h:outputScript library="assets" name="/js/plugin/jquery.sparkline/jquery.sparkline.min.js" />

    <!-- Datatables -->
    
	<h:outputScript library="assets" name="/js/plugin/datatables/datatables.min.js" />
    <!-- Kaiadmin JS -->
    
    <h:outputScript library="assets" name="/js/kaiadmin.min.js" />

    
  </h:body>
</html>
